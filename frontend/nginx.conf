server {
  listen 80;
  server_name _;
  # PEM 文件由服务端限制为 1 MB，HTTP multipart 还需要额外边界空间。
  client_max_body_size 2m;
  root /usr/share/nginx/html;
  index index.html;
  # Let's Encrypt HTTP-01 验证请求必须从公网 80 端口转发到后端。
  location /.well-known/acme-challenge/ { proxy_pass http://api:8080/.well-known/acme-challenge/; proxy_set_header Host $host; }
  location /api/ { proxy_pass http://api:8080/api/; proxy_set_header Host $host; }
  location /actuator/ { proxy_pass http://api:8080/actuator/; }
  location / { try_files $uri $uri/ /index.html; }
}
